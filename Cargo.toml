[workspace]
resolver = "2"
members = ["."]

[workspace.package]
authors = ["Faberline contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/faberline/guard"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
anyhow = "1.0"
clap = { version = "4", features = ["derive", "string"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1

[package]
name = "guard"
version = "0.1.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Security posture gate for cclab — compass-backed static findings with agent-readable reports"

[dependencies]
compass = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
clap = { workspace = true, features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true

[dev-dependencies]
tempfile = "3"
